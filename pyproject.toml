[project]
name = "designassist"
version = "0.1.0"
description = "AI design engine: Claude Code orchestrates skills that drive a design CLI (layout, type, colour, images) and deliver PNG/PDF/SVG, print-ready PDFs and editable Photoshop / Illustrator files."
requires-python = ">=3.11"
dependencies = [
  "resvg-py>=0.5",
  "uharfbuzz>=0.40",
  "fonttools>=4.50",
  "brotli>=1.1",
  "pillow>=10.1",
  "numpy>=1.26",
  "reportlab>=4.2",
  "psd-tools>=1.10",
  "vtracer>=0.6",
  "opencv-python-headless>=4.10",
  "requests>=2.32",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# background removal (onnxruntime + a ~170 MB model on first use); `uv sync --extra bg`
bg = ["rembg>=2.0.60", "onnxruntime>=1.17"]

# a dependency group, not an extra: `uv sync --extra bg` drops every extra it isn't given, the dev group stays
[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
da = "designassist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
